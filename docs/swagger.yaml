    type: object
  handlers.ChangeStepRequest:
    properties:
      remark:
        type: string
      step_id:
        type: integer
    type: object
  handlers.CreateApptRequest:
    properties:
      appt_date:
        type: string
      appt_time:
        type: string
      loan_appt_id:
        type: integer
      location:
        type: string
      remark:
        type: string
    type: object
  handlers.CreateMortgageRequest:
    properties:
      amount:
        type: number
      collateral:
        type: string
      guarantor_memb_no:
        type: string
      loan_type_id:
        type: integer
      memb_no:
        type: string
      purpose:
        type: string
      remark:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      memb_no:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handlers.RejectRequest:
    properties:
      remark:
        type: string
    type: object
  handlers.SetUserRoleRequest:
    properties:
      role:
        type: string
    type: object
  handlers.UpdateDocRequest:
    properties:
      doc_id:
        type: integer
      is_submitted:
        type: boolean
      remark:
        type: string
    type: object
  handlers.UpdateProfileRequest:
    properties:
      email:
        type: string
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      role:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    email: support@spsc.or.th
