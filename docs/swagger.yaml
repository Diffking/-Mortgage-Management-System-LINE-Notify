basePath: /api/v1
definitions:
  handlers.ApproveRequest:
    properties:
      contract_no:
        type: string
      remark:
        type: string
    type: object
  handlers.ChangeOfficerRequest:
    properties:
      officer_id:
        type: integer
      remark:
        type: string
    type: object
