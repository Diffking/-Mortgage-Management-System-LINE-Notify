    get:
      consumes:
      - application/json
      description: List all mortgages (Officer only)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by officer ID
        in: query
        name: officer_id
        type: integer
      - description: Filter by step ID
        in: query
        name: step_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List mortgages
      tags:
      - Mortgages
    post:
      consumes:
      - application/json
      description: Create a new mortgage (Officer only)
      parameters:
